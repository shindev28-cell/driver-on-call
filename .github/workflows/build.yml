name: Build Driver On Call APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare Flutter project
        shell: bash
        run: |
          set -e

          rm -rf /tmp/driver_source /tmp/driver_app

          mkdir -p /tmp/driver_source

          unzip -q Driver_On_Call_Project_Source.zip -d /tmp/driver_source

          flutter create \
            --platforms=android \
            --org com.driveroncall \
            --project-name app \
            /tmp/driver_app

          cp /tmp/driver_source/pubspec.yaml \
             /tmp/driver_app/pubspec.yaml

          cp /tmp/driver_source/lib/main.dart \
             /tmp/driver_app/lib/main.dart

          mkdir -p /tmp/driver_app/android/app

          cp /tmp/driver_source/android/app/google-services.json \
             /tmp/driver_app/android/app/google-services.json

          if [ -f /tmp/driver_app/android/app/build.gradle.kts ]; then
            sed -i 's/namespace = "[^"]*"/namespace = "com.driveroncall.app"/' \
              /tmp/driver_app/android/app/build.gradle.kts

            sed -i 's/applicationId = "[^"]*"/applicationId = "com.driveroncall.app"/' \
              /tmp/driver_app/android/app/build.gradle.kts
          fi

      - name: Get dependencies
        working-directory: /tmp/driver_app
        run: flutter pub get

      - name: Build APK
        working-directory: /tmp/driver_app
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Driver-On-Call-APK
          path: /tmp/driver_app/build/app/outputs/flutter-apk/app-debug.apk
