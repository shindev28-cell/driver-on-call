name: Deploy Admin Panel

on:
  workflow_dispatch:
  push:
    paths:
      - 'Driver_On_Call_Admin_Panel_v2_Driver_Management.zip'
      - '.github/workflows/admin-panel.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: admin-panel
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Admin Panel
        run: |
          mkdir -p admin_panel
          unzip -o Driver_On_Call_Admin_Panel_v2_Driver_Management.zip -d admin_panel
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Admin Panel
        uses: actions/upload-pages-artifact@v3
        with:
          path: admin_panel/admin

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
